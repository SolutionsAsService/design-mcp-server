[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "design-mcp-server"
version = "0.1.0"
description = "Read-only project and static CAD asset catalog MCP"
requires-python = ">=3.11"
dependencies = ["mcp>=1.9.0,<2.0.0"]

[project.scripts]
design-mcp-server = "design_mcp.server:main"

[tool.setuptools.packages.find]
include = ["design_mcp*"]
